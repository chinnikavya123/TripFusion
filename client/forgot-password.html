<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0"
    >

    <title>Forgot Password | TripFusion</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-body">

    <header class="navbar auth-navbar">
        <a href="./index.html" class="logo">
            TripFusion 
        </a>

        <a href="./login.html" class="auth-home-link">
            ← Back to Login
        </a>
    </header>

    <main class="password-recovery-page">

        <section class="password-recovery-card">

            <div class="otp-icon">
                🔐
            </div>

            <p class="otp-label">
                PASSWORD RECOVERY
            </p>

            <h1>Forgot your password?</h1>

            <p class="otp-description">
                Enter your registered email address. We will send
                you a six-digit OTP to reset your password.
            </p>

            <form id="forgot-password-form">

                <div class="auth-field">
                    <label for="forgot-email">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="forgot-email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                    <small
                        class="field-error"
                        id="forgot-email-error"
                    ></small>
                </div>

                <p
                    id="forgot-password-message"
                    class="auth-message"
                ></p>

                <button
                    type="submit"
                    id="send-reset-otp-button"
                    class="auth-submit-button"
                >
                    Send Reset OTP
                </button>

            </form>

            <p class="auth-switch">
                Remembered your password?

                <a href="./login.html">
                    Login
                </a>
            </p>

        </section>

    </main>

    <script src="./js/config.js?v=8"></script>
    <script src="./js/forgot-password.js"></script>

</body>
</html>
