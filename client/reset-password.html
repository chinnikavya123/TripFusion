<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0"
    >

    <title>Reset Password | TripFusion</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-body">

    <header class="navbar auth-navbar">
        <a href="./index.html" class="logo">
            TripFusion 
        </a>

        <a href="./login.html" class="auth-home-link">
            ← Back to Login
        </a>
    </header>

    <main class="password-recovery-page">

        <section class="password-recovery-card">

            <div class="otp-icon">
                🔑
            </div>

            <p class="otp-label">
                CREATE NEW PASSWORD
            </p>

            <h1>Reset your password</h1>

            <p class="otp-description">
                Create a strong new password for your
                TripFusion account.
            </p>

            <form id="reset-password-form">

                <div class="auth-field">
                    <label for="new-password">
                        New Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="new-password"
                            placeholder="Minimum 8 characters"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="new-password"
                        >
                            Show
                        </button>
                    </div>

                    <small
                        class="field-error"
                        id="new-password-error"
                    ></small>
                </div>

                <div class="auth-field">
                    <label for="confirm-new-password">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirm-new-password"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-new-password"
                        >
                            Show
                        </button>
                    </div>

                    <small
                        class="field-error"
                        id="confirm-new-password-error"
                    ></small>
                </div>

                <p
                    id="reset-password-message"
                    class="auth-message"
                ></p>

                <button
                    type="submit"
                    id="reset-password-button"
                    class="auth-submit-button"
                >
                    Reset Password
                </button>

            </form>

        </section>

    </main>

    <script src="./js/config.js"></script>
    <script src="./js/reset-password.js"></script>

</body>
</html>
