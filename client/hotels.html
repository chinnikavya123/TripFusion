<link rel="stylesheet" href="./css/style.css">

<body>

<header class="navbar">

<a href="./index.html" class="logo">
TripFusion
</a>

<nav class="nav-links">

<a href="./index.html">Home</a>

<section class="hotel-page">

<div class="hotel-header">

<h1>
Recommended Hotels
</h1>

<p>
Choose the perfect hotel for your trip.
</p>

</div>

<div class="hotel-filter-bar">

<input
type="text"
id="destination-input"
placeholder="Destination">

<select id="sort-select">

<option value="">
Sort By
</option>

<option value="rating">
Highest Rating
</option>

<option value="price-low">
Lowest Price
</option>

<option value="price-high">
Highest Price
</option>

</select>

<button id="search-hotels-button">

Search

</button>

</div>

<div class="hotel-disclaimer">
    Demo recommendations — prices and availability are shown for project demonstration and are not live hotel inventory.
</div>

<div
id="hotel-list"
class="hotel-grid"
>

</div>

<script src="./js/config.js"></script>
